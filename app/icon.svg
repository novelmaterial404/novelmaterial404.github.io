<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Lab monogram: an "N" whose diagonal is a dispersed beam in the site's
    spectral accent colours, on the site's darkest ink. Drawn with shapes, not
    text, so it renders identically everywhere and stays crisp at 16px.
  -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="0.5" stop-color="#2e9bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#070b16"/>
  <rect x="7.5" y="7.5" width="4.5" height="17" rx="1" fill="#f8f5ef"/>
  <rect x="20" y="7.5" width="4.5" height="17" rx="1" fill="#f8f5ef"/>
  <path d="M7.5 7.5 H12 L24.5 24.5 H20 Z" fill="url(#beam)"/>
</svg>
